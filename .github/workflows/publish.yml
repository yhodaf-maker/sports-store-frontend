name: Publish Production Frontend

on:
  # SAFETY: Production publishing is manual-only and remains operationally
  # disabled until the later deployment-hardening phase. Do not dispatch.
  workflow_dispatch:

permissions: {}

jobs:
  build-and-deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Assets
        run: npm run build

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload to S3
        env:
          S3_BUCKET: ${{ vars.AWS_FRONTEND_BUCKET_NAME }}
        run: |
          if [[ ! "$S3_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || [[ "$S3_BUCKET" == *..* ]]; then
            echo "Refusing invalid S3 bucket name." >&2
            exit 1
          fi
          aws s3 sync dist/ "s3://${S3_BUCKET}" --delete

      - name: Invalidate CloudFront Cache
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [[ ! "$CLOUDFRONT_DISTRIBUTION_ID" =~ ^E[A-Z0-9]{10,31}$ ]]; then
            echo "Refusing invalid CloudFront distribution ID." >&2
            exit 1
          fi
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
